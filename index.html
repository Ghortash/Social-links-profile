<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="styles.css">
   <link rel="shortcut icon" href="assets/images/favicon-32x32.png" type="image/x-icon">
   <title>Social links profile</title>
</head>
<body>
   <article class="container">
      <div class="main-block">
         <div class="main-block__avatar">
            <img src="assets/images/avatar-jessica.jpeg" alt="Avatar" class="main-block__avatar__image">
         </div>
         <div class="main-block__aboutMe">
            <h1 class="main-block__aboutMe__name">Jessica Randall</h1>
            <p class="main-block__aboutMe__location">London, United Kingdom</p>
            <p class="main-block__aboutMe__description">"Front-end developer and avid reader."</p>
         </div>
         <div class="main-block__links">
            <a href="#" class="main-block__links__link">GitHub</a>
            <a href="#" class="main-block__links__link">Frontend Mentor</a>
            <a href="#" class="main-block__links__link">LinkedIn</a>
            <a href="#" class="main-block__links__link">Twitter</a>
            <a href="#" class="main-block__links__link">Instagram</a>
         </div>
      </div>
   </article>
</body>
</html>
